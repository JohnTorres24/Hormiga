# ==============================================================================
spring.application.name=cazador-gastos-hormiga
server.port=${PORT:4000}

# ==============================================================================
# CONEXIÓN A BASE DE DATOS POSTGRESQL (SUPABASE POOLER)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-1-us-east-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres.nxlockddzloehrsrcyby}
spring.datasource.password=${DB_PASSWORD:0093215506Jhon}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ==============================================================================
