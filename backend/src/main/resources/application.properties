app.currency.base=${BASE_CURRENCY:USD}
app.currency.default-target=${TARGET_DEFAULT_CURRENCY:COP}

# ==============================================================================
# PARÁMETROS DE ALERTAS PRE-COBRO
# ==============================================================================
app.alerts.lead-hours=${PRE_BILLING_ALERT_HOURS:48}

# ==============================================================================
# LOGS Y FORMATO JSON
